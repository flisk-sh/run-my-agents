# Typecheck, lint and tests on every push and pull request, then the production image: built, started with no
# settings, and asked for its pages and SEO files.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bash test/test.sh

  board:
    name: Board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/app/board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: bun test
      # The eval itself calls paid models and runs by hand; its grader is plain logic and runs here.
      - name: Eval grader (evals/kitchen-steps)
        run: bun test ../../../evals/kitchen-steps
      - name: Kitchen agent (Flisk agent resource)
        run: bun test
        working-directory: services/app/kitchen
      # The Mac app ships the board as one compiled binary, so it must start with nothing on PATH: no Bun, Docker,
      # Tilt or Flisk, and no node_modules next to it.
      - name: Compiled board starts on its own
        run: |
          bun build --compile src/index.ts --outfile "$RUNNER_TEMP/board"
          mkdir -p "$RUNNER_TEMP/home/.claude/projects"
          (cd "$RUNNER_TEMP" && env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin PORT=4799 ./board > board.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4799/ && break; sleep 1; done
          curl -sf http://127.0.0.1:4799/ | grep -q preact || { cat "$RUNNER_TEMP/board.log"; exit 1; }
          curl -sf http://127.0.0.1:4799/api/sessions > /dev/null

  mac:
    name: Mac app compiles
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The release workflow only runs on main, so a Swift error would otherwise surface after the merge.
      - run: swiftc -typecheck -target arm64-apple-macos13.0 mac/RunMyAgents.swift -framework AppKit -framework WebKit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # The Mac app runs the board compiled, with a bare PATH: there every order got no worktree (#92-#94) while the
      # board from source made them. Run the board's worktree code the same way, on a Mac.
      - name: Compiled board makes an order worktree on macOS
        working-directory: services/app/board
        run: |
          bun install
          bun build --compile scripts/worktree-check.ts --outfile "$RUNNER_TEMP/wt-check"
          cd "$RUNNER_TEMP" && env -i HOME="$RUNNER_TEMP" PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin ./wt-check

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t web-ci .
      - name: Start and answer
        run: |
          docker run -d --name web -p 18090:10000 web-ci
          for i in $(seq 1 30); do curl -sf localhost:18090/ready && break; sleep 1; done
          curl -sf localhost:18090/ | grep -q 'application/ld+json'
          curl -sf localhost:18090/robots.txt | grep -q Sitemap
          curl -sf localhost:18090/sitemap.xml | grep -q '<urlset'
          curl -sf -o /dev/null localhost:18090/og.png
          docker logs web
