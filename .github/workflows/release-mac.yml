# Builds the Mac app for a release and attaches it, so the website's "Download for macOS" link
# (releases/latest/download/Run-My-Agents-macOS.zip) always serves the newest board. Runs when a v* tag is
# pushed, or by hand for an existing tag.
#
# With the Apple secrets set (docs/MAC_NOTARIZATION.md) the app is signed with a Developer ID certificate,
# notarized by Apple and stapled, so it opens on any Mac with no prompt. Without them it is ad-hoc signed as before,
# which macOS blocks after a browser download.
name: Release | Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, like v0.1.7"
        required: true

permissions:
  contents: write

jobs:
  mac:
    name: Mac app
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No Apple certificate secret: building ad-hoc signed."; exit 0; fi
          kc="$RUNNER_TEMP/rma.keychain-db"; pw="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          [ -n "$id" ] || { echo "The certificate is not a Developer ID Application certificate." >&2; exit 1; }
          echo "RUN_MY_AGENTS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "Signing as: $id"
      - name: Build
        run: RUN_MY_AGENTS_VERSION="$TAG" ./mac/build.sh --release
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "${RUN_MY_AGENTS_SIGN_IDENTITY:-}" ]; then echo "Not signed with Developer ID: skipping notarization."; exit 0; fi
          [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] || { echo "Signed, but the App Store Connect API key secrets are missing, so it cannot be notarized." >&2; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./mac/notarize.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: The bundled board starts with nothing on PATH
        run: |
          board="mac/build/Run My Agents.app/Contents/Resources/board"
          lipo -archs "$board" | grep -q arm64
          mkdir -p "$RUNNER_TEMP/home/.claude/projects"
          (env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin PORT=4799 "$board" > "$RUNNER_TEMP/board.log" 2>&1 &)
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4799/ && break; sleep 1; done
          curl -sf http://127.0.0.1:4799/ | grep -q preact || { cat "$RUNNER_TEMP/board.log"; exit 1; }
      - name: Gatekeeper accepts it (notarized builds)
        run: |
          [ -n "${RUN_MY_AGENTS_SIGN_IDENTITY:-}" ] || exit 0
          spctl --assess --type execute --verbose=2 "mac/build/Run My Agents.app"
          xcrun stapler validate "mac/build/Run My Agents.app"
      - name: Attach to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Run My Agents ${TAG#v}" --generate-notes
          gh release upload "$TAG" mac/build/Run-My-Agents-macOS.zip --clobber
